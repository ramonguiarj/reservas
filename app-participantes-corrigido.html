<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reservas Ramon Guia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
  --g:#07383a;
  --l:#9cff1e;
  --bg:#f1eedf;
  --ink:#173234;
  --mut:#647577;
  --line:#dcd8c8;
  --red:#a4332b;
  box-sizing:border-box
}

*{box-sizing:inherit}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.45 "Avenir Next",Avenir,Montserrat,system-ui,-apple-system,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)
}

header{
  background:var(--g);
  color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:5
}

.brandmark{width:36px;height:36px;object-fit:cover;border-radius:7px;flex:none}
.login-mark{display:block;width:88px;height:88px;object-fit:cover;border-radius:14px;margin:0 0 12px}

header b{
  flex:1;
  font-size:18px
}

button{
  font:inherit;
  border:0;
  border-radius:8px;
  padding:9px 14px;
  background:var(--g);
  color:#fff;
  cursor:pointer
}

button.alt{
  background:#fff;
  color:var(--g);
  border:1px solid var(--line)
}

button.lime{
  background:var(--l);
  color:var(--g);
  font-weight:600
}

button.bad{
  background:#fff;
  color:var(--red);
  border:1px solid var(--red)
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:3px solid var(--l);
  outline-offset:1px
}

main{
  max-width:760px;
  margin:0 auto;
  padding:14px
}

input,
select,
textarea{
  font:inherit;
  width:100%;
  padding:9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff
}

label{
  display:block;
  font-size:14px;
  color:var(--mut);
  margin:10px 0 3px
}

.row{
  display:flex;
  gap:10px
}

.row>*{
  flex:1;
  min-width:0
}

.nav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px
}

.nav b{
  flex:1;
  text-align:center
}

.tabs{
  display:flex;
  gap:8px;
  margin:0 0 14px;
  border-bottom:1px solid var(--line)
}

.tabs button{
  border-radius:8px 8px 0 0;
  background:transparent;
  color:var(--mut);
  border-bottom:3px solid transparent;
  padding:9px 12px
}

.tabs button[aria-selected="true"]{
  color:var(--g);
  border-bottom-color:var(--l);
  font-weight:700
}

.day{
  margin:16px 0 6px;
  font-weight:700;
  color:var(--g)
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer
}

.card.cancelada{
  opacity:.55
}

.top{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.m{
  color:var(--mut);
  font-size:14px
}

.tag{
  font-size:13px;
  padding:2px 8px;
  border-radius:99px;
  background:#e8eee6
}

.tag.finalizada{
  background:var(--l);
  color:var(--g)
}

.tag.cancelada{
  background:#f3dcd9;
  color:var(--red)
}

.open{
  color:var(--red);
  font-weight:600
}

.ok{
  color:var(--g);
  font-weight:600
}

dialog{
  border:0;
  border-radius:12px;
  max-width:560px;
  width:calc(100% - 20px);
  padding:16px;
  max-height:92vh;
  overflow:auto
}

dialog::backdrop{
  background:#0008
}

h3{
  margin:14px 0 6px
}

.line{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:6px 0;
  border-bottom:1px solid var(--line);
  font-size:14px
}

.void{
  text-decoration:line-through;
  color:var(--mut)
}

.empty{
  text-align:center;
  color:var(--mut);
  padding:30px 10px
}

#login{
  max-width:360px;
  margin:12vh auto;
  padding:20px
}

.acts{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:0 0 14px
}

.summary-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px
}

.summary-card span{
  display:block;
  color:var(--mut);
  font-size:13px
}

.summary-card strong{
  display:block;
  color:var(--g);
  font-size:20px;
  margin-top:3px;
  overflow-wrap:anywhere
}

.dashboard-map{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 14px}
.dashboard-map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dashboard-map-head h3{margin:0;color:var(--g)}
.dashboard-map-head p{margin:2px 0 0;color:var(--mut);font-size:13px}
.world-map{width:100%;height:auto;aspect-ratio:2/1;background:#edf5f1;border:1px solid #dce9e2;border-radius:8px;display:block}
.world-land{fill:#b9d3c3;stroke:#709a85;stroke-width:.65;stroke-linejoin:round}
.world-graticule{fill:none;stroke:#d6e5dd;stroke-width:.7;pointer-events:none}
.world-equator{stroke:#b6cfc0;stroke-dasharray:4 5}
.visitor-pin{fill:#a4332b;stroke:#fff;stroke-width:1.5;cursor:help}
.map-state-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.map-state-item{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:4px 8px;color:var(--g);font-size:12px}
.map-state-item::before{content:"";width:6px;height:6px;border-radius:50%;background:#a4332b}
.map-note{color:var(--mut);font-size:11px;margin:6px 0 0}
.dashboard-actions,.period-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:10px 0}
.period-tools label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.period-tools input{width:auto;min-width:140px}
.client-list{width:100%;border-collapse:collapse;background:#fff;margin:12px 0}
.client-list th,.client-list td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px;font-size:13px}
.client-list th{color:var(--mut);font-size:12px}
.panel-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 14px}
.print-only{display:none}
@media print{body{background:#fff}.print-only{display:block}header,.tabs,.no-print,.calendar,.dashboard-map{display:none!important}main{max-width:none;padding:0}.panel-box{border:0}.summary-card{border:1px solid #aaa}}

.booking-tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 12px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.booking-actionbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.booking-actionbar button{padding:7px 10px;font-size:14px}
.booking-tabs button{flex:none;border-radius:8px 8px 0 0;background:transparent;color:var(--mut);border-bottom:3px solid transparent;padding:9px 10px;white-space:nowrap}
.booking-tabs button[aria-selected="true"]{color:var(--g);border-bottom-color:var(--l);font-weight:700}
.booking-tab-panel{display:none}
.booking-tab-panel.active{display:block}
.booking-info{background:#f5f6f2;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.booking-info strong{display:block;color:var(--mut);font-size:12px;font-weight:600}

@media(max-width:520px){
  .summary{grid-template-columns:1fr}
  .summary-card{padding:10px 12px}
  .summary-card strong{font-size:19px}
}

.calendar{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-bottom:18px
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px
}

.calendar-weekday{
  text-align:center;
  color:var(--mut);
  font-size:12px;
  font-weight:600;
  padding:5px 0
}

.calendar-day{
  min-height:62px;
  padding:6px 2px;
  border:1px solid transparent;
  border-radius:8px;
  background:#f5f6f2;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:3px
}

.calendar-day:hover{border-color:var(--g)}
.calendar-day.selected{background:var(--g);color:#fff}
.calendar-day.today{border-color:var(--l);border-width:2px}
.calendar-day small{font-size:10px;line-height:1.1;color:inherit}
.calendar-day.empty-day{visibility:hidden}

@media(max-width:520px){
  .calendar{padding:6px}
  .calendar-grid{gap:2px}
  .calendar-day{min-height:48px;padding:5px 0;font-size:14px}
  .calendar-day small{font-size:9px}
}

.team-member{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.team-member p{margin:8px 0}
.team-member-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.team-member-actions button{margin:0}
.team-guide{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#f4f8f5;margin:12px 0}
.team-guide summary{font-weight:700;cursor:pointer;color:var(--g)}
.team-guide p{font-size:13px;margin:12px 0 0}
.team-profile-description{background:#f4f8f5;border-left:3px solid var(--g);padding:10px 12px;font-size:14px}
.team-audit{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px}
#team_permission_message{font-size:14px;overflow-wrap:anywhere}
</style>
</head>

const brl = n =>
  Number(n || 0).toLocaleString('pt-BR',{
    style:'currency',
    currency:'BRL'
  });

const iso = d =>
  d.getFullYear() +
  '-' +
  String(d.getMonth()+1).padStart(2,'0') +
  '-' +
  String(d.getDate()).padStart(2,'0');

const addDays = (d,n) => {
  const x = new Date(d);
  x.setDate(x.getDate()+n);
  return x;
};

const monday = d => {
  const x = new Date(d);
  x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x;
};

const dBR = s =>
  s ? s.split('-').reverse().join('/') : '';

const dtBR = s =>
  s
    ? new Date(s).toLocaleString('pt-BR',{
        dateStyle:'short',
        timeStyle:'short'
      })
    : '';

const paid = b =>
  (b.payments || [])
    .filter(p => !p.voided)
    .reduce((s,p) => s + Number(p.amount),0);

const nm = id =>
  (team[id] && team[id].name) || '—';

const val = id =>
  $('#' + id).value;

function bookingServices(b){
  if(Array.isArray(b.schedule_items) && b.schedule_items.length) return b.schedule_items.map((item,index)=>({
    ...item,
    tour_date:item.tour_date || (index===0 ? b.tour_date : null),
    tour_time:item.tour_time || (index===0 ? b.tour_time : null)
  }));
  return [{
    service_id:'principal',tour_date:b.tour_date,tour_time:b.tour_time,
    itinerary:b.itinerary,pax:b.pax,ticket_included:b.ticket_included
  }];
}

function qrCodeUrl(value){
  return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&format=png&data=${encodeURIComponent(value)}`;
}

let me;
let acc;
let team = {};
let bookings = [];
let summaryBookings = [];
let itineraryCache = [];
let googleAccessToken = '';

let selectedDate = iso(new Date());
let agendaFilter = {year:String(new Date().getFullYear()),month:String(new Date().getMonth()+1),date:'',status:'todos'};
let activeTab = 'inicio';
let authMode = 'login';
let activeBookingTab = 'dados';
let dashboardYear = new Date().getFullYear();

function accessLevel(){
  return me?.role === 'owner' ? 'total' : (me?.access_level || 'visualizar');
}
function canAdd(){ return ['adicionar','total'].includes(accessLevel()); }
function canManage(){ return accessLevel() === 'total'; }
function accessLabel(level){
  return ({visualizar:'Visualizar',adicionar:'Adicionar',total:'Gerenciar'})[level] || 'Visualizar';
}


// ===============================
// LOGIN / INICIALIZAÇÃO
// ===============================

async function start(){

  const recovery = new URLSearchParams(location.hash.slice(1)).get('type') === 'recovery';

  const {
    data:{session}
  } = await db.auth.getSession();

  if(recovery && session){
    return passwordRecoveryView();
  }

  if(!session){
    return loginView();
  }

  const m = await db
    .from('members')
    .select('*');

  team = Object.fromEntries(
    (m.data || []).map(x => [x.user_id,x])
  );

  me = team[session.user.id];

  if(!me){
    await db.auth.signOut();

    return loginView(
      'Este e-mail não tem acesso. Peça um convite ao dono.'
    );
  }

  acc = (
    await db
      .from('accounts')
      .select('*')
      .single()
  ).data;

  await load();
}


function loginView(msg){

  const invitedEmail = new URLSearchParams(location.search).get('convite') || '';
  const signingUp = authMode === 'signup';
  const forgot = authMode === 'forgot';

      <h2>Reservas</h2>

      <label for="em">E-mail</label>
      <input
        id="em"
        type="email"
        value="${esc(invitedEmail)}"
        autocomplete="username"
      >

      <label for="pw">Senha</label>
      <input
        id="pw"
        type="password"
        autocomplete="${signingUp ? 'new-password' : 'current-password'}"
      >

      <button type="button" class="alt" onclick="togglePassword('pw',this)">Mostrar senha</button>

      ${signingUp ? `
        <ul class="m" id="password-rules">
          <li data-rule="length">Pelo menos 8 caracteres</li>
          <li data-rule="upper">Uma letra maiúscula</li>
          <li data-rule="lower">Uma letra minúscula</li>
          <li data-rule="number">Um número</li>
          <li data-rule="special">Um caractere especial (ex.: !, @ ou #)</li>
        </ul>
        <label for="pw_confirm">Repita a senha</label>
        <input id="pw_confirm" type="password" autocomplete="new-password">
        <button type="button" class="alt" onclick="togglePassword('pw_confirm',this)">Mostrar confirmação</button>
      ` : ''}

      <p class="open" id="msg">
        ${esc(msg || '')}
      </p>

      <div class="acts">
        ${forgot ? `
          <button onclick="sendPasswordRecovery()">Enviar link para redefinir senha</button>
          <button class="alt" onclick="setAuthMode('login')">Voltar para entrar</button>
        ` : signingUp ? `
          <button onclick="signup()">Criar conta com convite</button>
          <button class="alt" onclick="setAuthMode('login')">Voltar para entrar</button>
        ` : `
          <button onclick="login()">Entrar</button>
          <button class="alt" onclick="setAuthMode('signup')">Criar conta com convite</button>
          <button class="alt" onclick="setAuthMode('forgot')">Esqueci minha senha</button>
        `}
      </div>

    </div>
  `;
}

function setAuthMode(mode){
  const email = $('#em')?.value.trim();
  if(email){
    const url = new URL(location.href);
    url.searchParams.set('convite',email);
    history.replaceState(null,'',url);
  }
  authMode = mode;
  loginView();
  if(mode === 'signup') $('#pw').addEventListener('input',updatePasswordRules);
}

function passwordChecks(password){
  return {
    length:password.length >= 8,
    upper:/[A-Z]/.test(password),
    lower:/[a-z]/.test(password),
    number:/[0-9]/.test(password),
    special:/[^A-Za-z0-9\s]/.test(password)
  };
}

function updatePasswordRules(){
  const checks = passwordChecks($('#pw')?.value || '');
  for(const [rule,ok] of Object.entries(checks)){
    const item = document.querySelector(`[data-rule="${rule}"]`);
    if(item){ item.style.color = ok ? 'var(--g)' : 'var(--mut)'; item.style.fontWeight = ok ? '700' : '400'; }
  }
}

function togglePassword(id,button){
  const input = $('#' + id);
  const showing = input.type === 'password';
  input.type = showing ? 'text' : 'password';
  button.textContent = showing ? 'Ocultar senha' : (id === 'pw_confirm' ? 'Mostrar confirmação' : 'Mostrar senha');
}

function passwordRecoveryView(){
  $('#app').innerHTML = `<div id="login"><h2>Redefinir senha</h2>
    <label for="new_pw">Nova senha</label><input id="new_pw" type="password" autocomplete="new-password" oninput="updateRecoveryRules()">
    <button type="button" class="alt" onclick="togglePassword('new_pw',this)">Mostrar senha</button>
    <ul class="m" id="password-rules"><li data-rule="length">Pelo menos 8 caracteres</li><li data-rule="upper">Uma letra maiúscula</li><li data-rule="lower">Uma letra minúscula</li><li data-rule="number">Um número</li><li data-rule="special">Um caractere especial (ex.: !, @ ou #)</li></ul>
    <label for="new_pw_confirm">Repita a nova senha</label><input id="new_pw_confirm" type="password" autocomplete="new-password">
    <button type="button" class="alt" onclick="togglePassword('new_pw_confirm',this)">Mostrar confirmação</button>
    <p class="open" id="msg"></p><div class="acts"><button onclick="updatePassword()">Salvar nova senha</button></div></div>`;
}

function updateRecoveryRules(){
  const checks = passwordChecks($('#new_pw')?.value || '');
  for(const [rule,ok] of Object.entries(checks)){
    const item = document.querySelector(`[data-rule="${rule}"]`);
    if(item){ item.style.color = ok ? 'var(--g)' : 'var(--mut)'; item.style.fontWeight = ok ? '700' : '400'; }
  }
}

async function updatePassword(){
  const password = $('#new_pw').value;
  const checks = passwordChecks(password);
  if(Object.values(checks).some(ok => !ok)) return $('#msg').textContent = 'A senha ainda não atende a todos os requisitos.';
  if(password !== $('#new_pw_confirm').value) return $('#msg').textContent = 'As senhas não coincidem.';
  const {error} = await db.auth.updateUser({password});
  if(error) return $('#msg').textContent = error.message;
  await db.auth.signOut();
  history.replaceState(null,'',location.pathname + location.search);
  authMode = 'login';
  loginView('Senha redefinida. Entre com sua nova senha.');
}

async function sendPasswordRecovery(){
  const email = val('em').trim();
  if(!email) return $('#msg').textContent = 'Informe seu e-mail para receber o link.';
  const redirectTo = new URL(location.href);
  redirectTo.search = '';
  redirectTo.hash = '';
  const {error} = await db.auth.resetPasswordForEmail(email,{redirectTo:redirectTo.toString()});
  if(error) return $('#msg').textContent = error.message;
  $('#msg').textContent = 'Se este e-mail tiver uma conta, enviaremos um link para redefinir a senha. Confira também o spam.';
}


async function login(){

  const email = val('em').trim();
  const password = val('pw');

  if(!email || !password){
    return $('#msg').textContent =
      'Informe o e-mail e a senha.';
  }

  const r = await db.auth.signInWithPassword({
    email,
    password
  });

  if(r.error){
    console.error(r.error);

    return $('#msg').textContent =
      r.error.message;
  }

  await start();
}


async function signup(){

  const password = val('pw');
  const checks = passwordChecks(password);
  if(Object.values(checks).some(ok => !ok)) return $('#msg').textContent = 'A senha precisa atender a todos os requisitos mostrados.';
  if(password !== val('pw_confirm')) return $('#msg').textContent = 'As senhas não coincidem.';

  const r = await db.auth.signUp({
    email:val('em').trim(),
    password
  });

  if(r.error){

    return $('#msg').textContent =
      r.error.message.includes('convite')
        ? 'Este e-mail não foi convidado.'
        : r.error.message;
  }

  $('#msg').textContent =
    'Conta criada. Se pedir, confirme o e-mail e entre.';

  if(r.data.session){
    start();
  }
}


async function logout(){

  await db.auth.signOut();

  loginView();
}


// ===============================
// CARREGAR RESERVAS
// ===============================

async function load(){

  const r = await db
    .from('bookings')
    .select('*, payments!payments_booking_account_fkey(*)')
    .is('deleted_at',null)
    .order('tour_date')
    .order('tour_time');

  if(r.error){
    return alert('Não foi possível carregar as reservas: ' + r.error.message);
  }

  bookings = r.data || [];
  summaryBookings = bookings;

  render();
}

function setActiveTab(tab){
  activeTab = tab;
  render();
}


function calendarView(){

  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const firstWeekday = (new Date(year,month,1).getDay()+6)%7;
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthName = calendarMonth.toLocaleDateString('pt-BR',{
    month:'long',year:'numeric'
  });
  const weekdays = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

  let cells = weekdays.map(name =>
    `<div class="calendar-weekday">${name}</div>`
  ).join('');

  for(let i=0;i<firstWeekday;i++){
    cells += '<div class="calendar-day empty-day" aria-hidden="true"></div>';
  }

  for(let day=1;day<=daysInMonth;day++){
    const date = iso(new Date(year,month,day));
    const count = summaryBookings.filter(b =>
      bookingServices(b).some(item => item.tour_date === date) && b.status !== 'cancelada'
    ).length;
    const selected = date === selectedDate;
    const today = date === iso(new Date());
    const fullDate = new Date(year,month,day).toLocaleDateString('pt-BR',{
      weekday:'long',day:'numeric',month:'long',year:'numeric'
    });

    cells += `
      <button
        class="calendar-day ${selected ? 'selected' : ''} ${today ? 'today' : ''}"
        aria-label="${esc(fullDate)}${count ? ', ' + count + ' reservas' : ''}"
        aria-pressed="${selected}"
        onclick="selectDate('${date}')"
      >
        <span>${day}</span>
        ${count ? `<small>${count} ${count === 1 ? 'reserva' : 'reservas'}</small>` : ''}
      </button>
    `;
  }

  return `
    <section aria-label="Agenda mensal">
      <div class="nav">
        <button class="alt" aria-label="Mês anterior" onclick="changeMonth(-1)">‹</button>
        <b style="text-transform:capitalize">${esc(monthName)}</b>
        <button class="alt" aria-label="Próximo mês" onclick="changeMonth(1)">›</button>
        <button class="alt" onclick="goToday()">Hoje</button>
      </div>
      <div class="calendar">
        <div class="calendar-grid">${cells}</div>
      </div>
    </section>
  `;
}


function dayBookingsView(){

  const [year,month,day] = selectedDate.split('-').map(Number);
  const date = new Date(year,month-1,day);
  const fullDate = date.toLocaleDateString('pt-BR',{
    weekday:'long',day:'numeric',month:'long',year:'numeric'
  });
  const list = summaryBookings
    .filter(b => bookingServices(b).some(item => item.tour_date === selectedDate))
    .sort((a,b) => {
      const at = bookingServices(a).find(item => item.tour_date === selectedDate)?.tour_time || '';
      const bt = bookingServices(b).find(item => item.tour_date === selectedDate)?.tour_time || '';
      return at.localeCompare(bt);
    });

  let h = `<h2 style="text-transform:capitalize">${esc(fullDate)}</h2>`;

  if(!list.length){
    return h + '<div class="empty">Nenhum serviço agendado para este dia.</div>';
  }

  for(const b of list){
    const open = Number(b.total) - paid(b);
    const servicesToday = bookingServices(b).filter(item => item.tour_date === selectedDate);
    h += `
      <div class="card ${b.status}" onclick="openBooking('${b.id}')">
        <div class="top">
          <b>${esc((servicesToday[0]?.tour_time || '').slice(0,5))} ${esc(b.client_name)}</b>
          <span class="tag ${b.status}">${esc(b.status)}</span>
        </div>
        <div class="m"><b>Localizador: ${esc(b.booking_code || b.id)}</b></div>
        <div class="m">${servicesToday.map(item => `${esc(item.itinerary || 'Sem roteiro')} · ${esc(item.pax)} pessoa(s)`).join('<br>')}</div>
        <div class="m">
          Total ${brl(b.total)} · Pago ${brl(paid(b))} ·
          <span class="${open > 0 ? 'open' : 'ok'}">
            ${open > 0 ? 'Em aberto ' + brl(open) : 'Quitado'}
          </span>
        </div>
      </div>
    `;
  }

  return h;
}

function agendaFiltersView(){
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const years = new Set([String(new Date().getFullYear())]);
  for(const booking of bookings){
    for(const item of bookingServices(booking)){
      const year = String(item.tour_date || '').slice(0,4);
     if(/^\d{4}$/.test(year)) years.add(year);
    }
  }
  const yearOptions = ['<option value="todos">Todos os anos</option>',...Array.from(years).sort((a,b)=>Number(b)-Number(a)).map(year=>`<option value="${year}" ${agendaFilter.year===year?'selected':''}>${year}</option>`)].join('');
  const monthOptions = ['<option value="todos">Todos os meses</option>',...months.map((name,index)=>`<option value="${index+1}" ${agendaFilter.month===String(index+1)?'selected':''}>${name}</option>`)].join('');
  const matches = bookings.filter(booking=>{
    const services = bookingServices(booking);
    const matchesDate = agendaFilter.date
      ? services.some(item=>item.tour_date===agendaFilter.date)
      : services.some(item=>{
          const [year,month] = String(item.tour_date || '').split('-');
          return (agendaFilter.year==='todos'||year===agendaFilter.year)
            && (agendaFilter.month==='todos'||String(Number(month))===String(Number(agendaFilter.month)));
        });
    if(!matchesDate) return false;
    const payments = (booking.payments || []).filter(payment=>Number(payment.amount || 0)>0);
    const fullyReversed = payments.length>0 && payments.every(payment=>payment.voided);
    const rescheduled = Number(booking.reschedule_count || 0)>0 || Boolean(booking.rescheduled_at);
    if(agendaFilter.status==='agendada') return booking.status==='aberta' && !rescheduled;
    if(agendaFilter.status==='cancelada') return booking.status==='cancelada';
    if(agendaFilter.status==='reagendada') return booking.status==='aberta' && rescheduled;
    if(agendaFilter.status==='estorno_total') return fullyReversed;
    if(agendaFilter.status==='finalizada') return booking.status==='finalizada';
    return true;
  }).sort((a,b)=>{
    const ad=bookingServices(a).map(item=>item.tour_date).sort()[0]||'';
    const bd=bookingServices(b).map(item=>item.tour_date).sort()[0]||'';
    return ad.localeCompare(bd);
  });

  return `
    <section aria-label="Filtros da agenda">
      <h2>Agenda e filtros</h2>
      <div class="row">
        <div><label for="agenda_year">Ano</label><select id="agenda_year" onchange="setAgendaFilter('year',this.value)">${yearOptions}</select></div>
        <div><label for="agenda_month">Mês</label><select id="agenda_month" onchange="setAgendaFilter('month',this.value)">${monthOptions}</select></div>
      </div>
      <div class="row">
        <div><label for="agenda_date">Data específica</label><input id="agenda_date" type="date" value="${esc(agendaFilter.date)}" onchange="setAgendaFilter('date',this.value)"></div>
        <div><label for="agenda_status">Situação</label><select id="agenda_status" onchange="setAgendaFilter('status',this.value)">
          <option value="todos" ${agendaFilter.status==='todos'?'selected':''}>Todas as situações</option>
          <option value="agendada" ${agendaFilter.status==='agendada'?'selected':''}>Agendadas</option>
          <option value="cancelada" ${agendaFilter.status==='cancelada'?'selected':''}>Canceladas</option>
          <option value="reagendada" ${agendaFilter.status==='reagendada'?'selected':''}>Reagendadas</option>
          <option value="estorno_total" ${agendaFilter.status==='estorno_total'?'selected':''}>Estorno total</option>
          <option value="finalizada" ${agendaFilter.status==='finalizada'?'selected':''}>Finalizadas</option>
        </select></div>
      </div>
      <button class="alt" onclick="clearAgendaFilters()">Limpar filtros</button>
      <h3>${matches.length} ${matches.length===1?'reserva encontrada':'reservas encontradas'}</h3>
      ${matches.length ? matches.map(booking=>{
        const services=bookingServices(booking);
        const dates=services.map(item=>dBR(item.tour_date)).join(', ');
        const voided=(booking.payments||[]).filter(payment=>payment.voided).reduce((sum,payment)=>sum+Number(payment.amount||0),0);
        const allVoided=(booking.payments||[]).filter(payment=>Number(payment.amount||0)>0).length>0 && (booking.payments||[]).filter(payment=>Number(payment.amount||0)>0).every(payment=>payment.voided);
        const status=allVoided?'Estorno total':booking.status==='cancelada'?'Cancelada':booking.status==='finalizada'?'Finalizada':Number(booking.reschedule_count||0)>0?'Reagendada':'Agendada';
        return `<div class="card ${esc(booking.status)}" onclick="openBooking('${booking.id}')"><div class="top"><b>${esc(dates)} · ${esc(booking.client_name)}</b><span class="tag ${esc(booking.status)}">${status}</span></div><div class="m">${services.map(item=>`${esc(item.itinerary)} · ${esc(item.tour_time||'').slice(0,5)} · ${esc(item.pax)} pessoa(s)`).join('<br>')}</div><div class="m">Localizador: ${esc(booking.booking_code||booking.id)} · Total ${brl(booking.total)}${allVoided?` · Estorno total ${brl(voided)}`:''}</div></div>`;
      }).join('') : '<div class="empty">Nenhuma reserva encontrada com esses filtros.</div>'}
    </section>
  `;
}

function setAgendaFilter(key,value){
  agendaFilter[key]=value;
  if((key==='year'||key==='month') && agendaFilter.date) agendaFilter.date='';
  if(key==='date' && value){
    const [year,month]=value.split('-');
    agendaFilter.year=year;
    agendaFilter.month=String(Number(month));
  }
  render();
}

function clearAgendaFilters(){
  agendaFilter={year:'todos',month:'todos',date:'',status:'todos'};
  render();
}


function selectDate(date){
  selectedDate = date;
  const [year,month] = date.split('-').map(Number);
  calendarMonth = new Date(year,month-1,1);
  render();
}


function changeMonth(amount){
  calendarMonth = new Date(
    calendarMonth.getFullYear(),
    calendarMonth.getMonth()+amount,
    1
  );
  render();
}


function goToday(){
  const today = new Date();
  selectedDate = iso(today);
  calendarMonth = new Date(today.getFullYear(),today.getMonth(),1);
  render();
}


function summaryView(){

  // Reservas canceladas ficam fora dos indicadores financeiros.
  const active =
    summaryBookings.filter(b => b.status !== 'cancelada');

  const totalReservations =
    active.reduce((sum,b) => sum + Number(b.total || 0),0);

  const totalDeposits =
    active.reduce((sum,b) =>
      sum + (b.payments || [])
        .filter(p => !p.voided && p.payment_type === 'sinal')
        .reduce((paidSum,p) => paidSum + Number(p.amount || 0),0)
    ,0);

  return `
    <section class="summary" aria-label="Resumo de reservas">
      <div class="summary-card">
        <span>Quantidade de reservas</span>
        <strong>${summaryBookings.length}</strong>
      </div>
      <div class="summary-card">
        <span>Valor total das reservas</span>
        <strong>${brl(totalReservations)}</strong>
      </div>
      <div class="summary-card">
        <span>Sinais pagos</span>
        <strong>${brl(totalDeposits)}</strong>
      </div>
    </section>
  `;
}

function clientRecords(){
  const map=new Map();
  for(const b of summaryBookings){
    const key=String(b.client_email||b.client_document||b.client_name||'').trim().toLowerCase();
    if(!key) continue;
    const c=map.get(key)||{name:b.client_name||'—',email:b.client_email||'',phone:b.client_phone||'',document:b.client_document||'',state:b.client_state||'',birthday:b.client_birthday||'',reservations:0,lastDate:''};
    c.reservations++; if((b.tour_date||'')>c.lastDate)c.lastDate=b.tour_date||'';
    if(b.client_state)c.state=b.client_state;if(b.client_birthday)c.birthday=b.client_birthday;
    map.set(key,c);

  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
}
function dashboardView(){
  const years=[...new Set([new Date().getFullYear(),...summaryBookings.flatMap(b=>bookingServices(b).map(x=>Number(String(x.tour_date||b.tour_date||'').slice(0,4))).filter(Boolean))])].sort((a,b)=>b-a);
  const yearBookings=summaryBookings.filter(b=>bookingServices(b).some(x=>String(x.tour_date||b.tour_date||'').startsWith(String(dashboardYear))));
  const visitors=new Set(yearBookings.map(b=>String(b.client_email||b.client_document||b.client_name||'').trim().toLowerCase()).filter(Boolean)).size;
  const byState={},stateVisitors={}; for(const b of yearBookings){const s=String(b.client_state||'').toUpperCase(),key=String(b.client_email||b.client_document||b.client_name||'').trim().toLowerCase();if(STATE_POINTS[s]&&key){if(!stateVisitors[s])stateVisitors[s]=new Set();stateVisitors[s].add(key)}}

function paymentRows(){

async function backupSha256(text){
  const bytes=new TextEncoder().encode(text);
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
}
async function collectAccountBackup(client,accountId,onProgress=()=>{}){
  const result=await client.rpc('get_account_backup_manifest',{p_account_id:accountId});
  if(result.error) throw new Error(result.error.message);
  const manifest=result.data;
  const allowed=['accounts','members','invites','itineraries','bookings','payments','audit_log','birthday_email_log','booking_save_requests'];
  if(manifest?.format!=='ramon-guia-business-backup' || manifest.version!==2 || manifest.account_id!==accountId || !Array.isArray(manifest.tables) || manifest.tables.length!==allowed.length) throw new Error('Manifesto da cópia inválido.');
  const tables={},seenTables=new Set();
  for(const info of manifest.tables){
    if(!allowed.includes(info.name) || seenTables.has(info.name) || !Number.isSafeInteger(info.count) || info.count<0) throw new Error('Tabela ou contagem da cópia inválida.');
    seenTables.add(info.name);
    const rows=[],hashes=[],keys=new Set(); let cursor=null;
    do{
      const page=await client.rpc('get_account_backup_page',{p_account_id:accountId,p_table:info.name,p_after:cursor,p_limit:200});
      if(page.error) throw new Error(page.error.message);
      if(!Array.isArray(page.data) || page.data.length>200) throw new Error('Página da cópia inválida.');
      if(!page.data.length) break;
      for(const row of page.data){
        if(typeof row.row_key!=='string' || typeof row.row_text!=='string' || keys.has(row.row_key)) throw new Error('Página repetida ou registro inválido na cópia.');
        const data=JSON.parse(row.row_text);
        if(!data || Array.isArray(data) || typeof data!=='object') throw new Error('Conteúdo da cópia inválido.');
        keys.add(row.row_key); rows.push(row.row_text); hashes.push(await backupSha256(row.row_text));
      }
      cursor=page.data[page.data.length-1].row_key;
      if(rows.length>info.count) throw new Error('Os dados mudaram durante a exportação. Gere a cópia novamente.');
      onProgress(info.name,rows.length,info.count);
    }while(rows.length<info.count);
    if(rows.length!==info.count || await backupSha256(hashes.join(''))!==info.sha256) throw new Error('A conferência da cópia falhou ou os dados mudaram. Gere a cópia novamente.');
    tables[info.name]=rows;
  }
  return {format:manifest.format,version:2,account_id:accountId,exported_at:manifest.exported_at,encoding:'postgres-jsonb-text',manifest:manifest.tables,tables};
}
let accountBackupInProgress=false;
async function downloadBackup(){
  if(me?.role!=='owner') return alert('Somente o proprietário pode baixar a cópia de segurança.');
  if(accountBackupInProgress) return;
  accountBackupInProgress=true;
  try{
    const payload=await collectAccountBackup(db,acc.id);
    const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=`backup-reservas-${iso(new Date())}.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert('Cópia dos dados da conta conferida e enviada para Downloads. Guarde o arquivo em outro local seguro.');
  }catch(error){alert('Não foi possível concluir a cópia: '+error.message);}
  finally{accountBackupInProgress=false;}
}

function phoneOrigin(raw){
  const text = String(raw || '').trim();
  let digits = text.replace(/\D/g,'');
  const intl = text.startsWith('+') || digits.startsWith('00');
  if(digits.startsWith('00')) digits = digits.slice(2);

  let brazilLocal = null;
  if(!intl){
    if(digits.length >= 12 && digits.startsWith('55')) brazilLocal = digits.slice(2); // 55 + DDD sem o "+"
    else if(digits.length === 10 || digits.length === 11) brazilLocal = digits;      // DDD + número
    else return null;
  }else if(digits.startsWith('55')){
    brazilLocal = digits.slice(2);
  }

  if(brazilLocal !== null){
    const state = DDD_STATE[brazilLocal.slice(0,2)];
    return state ? {country:'Brasil',state} : null;
  }

  for(const len of [3,2,1]){
    const country = COUNTRY_CODES[digits.slice(0,len)];
    if(country) return {country,state:''};
  }
  return null;
}

function detectPhoneOrigin(){
  const state = $('#c_state');
  const country = $('#c_country');
  if(!state || !country) return;
  if(state.dataset.manual || country.dataset.manual) return; // não sobrescreve escolha manual
  const origin = phoneOrigin($('#c_tel').value);
  if(!origin) return;
  country.value = origin.country;
  state.value = origin.state;
}

            <input
              id="p_dt"

            class="lime"
            onclick="addPay('${id}')"

          </button>

        </div>

      `;
    }


    h += '<div class="acts">';


    if(b.status === 'aberta' && canManage()){

      if(me.role === 'owner'){

        h += `
          <button
            onclick="setStatus('${id}','finalizada')"
          >

          </button>
        `;
      }

      if(canManage()) h += `

      `;

      h += `
        <button
          class="alt"
          onclick="setStatus('${id}','aberta')"
        >
          Reabrir
        </button>
      `;
    }

    if(canManage() && (me.role === 'owner' || b.status === 'aberta')){
      h += `<button class="bad" onclick="deleteBooking('${id}')">Excluir reserva</button>`;
    }


    h += '</div>';


    h += `

      <h3>
        Histórico
      </h3>

      ${
        hist.map(x => `

          <div class="line">

            <span>
              ${esc(x.action)}
              ·
              ${esc(nm(x.user_id))}
            </span>

            <span class="m">
              ${dtBR(x.at)}
            </span>

          </div>

        `).join('')

        || '<div class="m">Sem registros.</div>'
      }

    `;
  }


  $('#dlg').innerHTML = h;

  if(locked){
    $('#dlg').querySelectorAll('[id^="c_"],[id^="v_"],.schedule-row input,.schedule-row select,.schedule-row textarea,.schedule-row button').forEach(input=>{input.disabled=true;});

  }
  $('#dlg').dataset.writeVersion = id ? String(b.write_version ?? '') : '';
  if(id) configureBookingTabs(id,b);

  updateGrandTotal();
  $('#dlg').showModal();
}

function sendBookingVoucherWhatsApp(id){
  const booking=bookings.find(item=>item.id===id);
  if(!booking) return alert('Não encontrei esta reserva. Atualize a agenda e tente novamente.');
  const phone=String(booking.client_phone||'').replace(/\D/g,'');
  if(!phone) return alert('Cadastre o WhatsApp do cliente antes de preparar o envio.');
  const locator=booking.booking_code||booking.id;
  const services=bookingServices(booking).map(item=>`• ${dBR(item.tour_date)}${item.tour_time?' às '+String(item.tour_time).slice(0,5):''} — ${item.itinerary} — ${item.pax} pessoa(s)`).join('\n');
  const message=`Olá ${String(booking.client_name||'').trim().split(/\s+/)[0]||'tudo bem'}! Seguem os dados da sua reserva ${locator}:\n\n${services}\n\n${booking.pickup_location?`Ponto de encontro/busca: ${booking.pickup_location}\n`:''}${booking.client_message?`Informações importantes: ${booking.client_message}\n`:''}Em caso de dúvidas, fale com a equipe.`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,'_blank','noopener');
}

function configureBookingTabs(id,booking){
  const dlg=$('#dlg');
  const header=document.createElement('div');
  header.className='booking-header';
  const panels={dados:document.createElement('section'),financeiro:document.createElement('section'),carrinho:document.createElement('section'),alteracoes:document.createElement('section')};
  for(const [key,panel] of Object.entries(panels)){panel.className='booking-tab-panel'+(key==='dados'?' active':'');panel.dataset.tab=key;}
  let current='dados';
  let started=false;
  for(const node of Array.from(dlg.children)){
    if(node.matches('form') || (!started && node.tagName!=='H3')){header.append(node);continue;}
    if(node.tagName==='H3'){
      started=true;
      const title=node.textContent.trim().toLowerCase();
      if(title.includes('pagamentos') || title.includes('valores e sinal')) current='financeiro';
      else if(title.includes('histórico')) current='alteracoes';
      else if(title.includes('serviço') || title.includes('roteiros') || title.includes('voucher')) current='carrinho';
      else if(title.includes('dados do cliente')) current='dados';
    }
    (panels[current]||panels.dados).append(node);
  }

  const customerHistory=bookings.filter(item=>item.id!==id && (
    (booking.client_document && String(item.client_document||'').replace(/\D/g,'')===String(booking.client_document).replace(/\D/g,'')) ||
    (booking.client_email && String(item.client_email||'').trim().toLowerCase()===String(booking.client_email).trim().toLowerCase())
  ));
  const people=document.createElement('section');
  people.className='booking-tab-panel';people.dataset.tab='participantes';
  people.innerHTML=`<h3>Participantes</h3><div class="booking-info"><strong>Cliente responsável</strong>${esc(booking.client_name||'—')}</div><div class="booking-info"><strong>Documento</strong>${esc(booking.client_document||'—')}</div>`;
  // Move o campo original, preservando valor, evento e permissões.
  const paxField = dlg.querySelector('#c_px');
  if(paxField){
    people.append(paxField.parentElement);
  }
  const history=document.createElement('section');
  history.className='booking-tab-panel';history.dataset.tab='historico';
  history.innerHTML=`<h3>Histórico do cliente</h3>${customerHistory.length?customerHistory.map(item=>`<div class="booking-info" role="button" tabindex="0" onclick="openBooking('${item.id}')"><strong>${esc(item.booking_code||'Reserva')} · ${dBR(item.tour_date)}</strong>${esc(item.itinerary||'Serviço')} · ${esc(item.status||'')}</div>`).join(''):'<div class="empty">Nenhuma outra reserva encontrada para este cliente.</div>'}`;

  const tabs=[['dados','Dados'],['financeiro','Financeiro'],['participantes','Participantes'],['carrinho','Carrinho'],['historico','Histórico do cliente'],['alteracoes','Alterações']];
  const nav=document.createElement('nav');nav.className='booking-tabs';nav.setAttribute('role','tablist');nav.setAttribute('aria-label','Seções da reserva');
  nav.innerHTML=tabs.map(([key,label])=>`<button type="button" role="tab" aria-selected="${key==='dados'}" onclick="setBookingTab('${key}',this)">${label}</button>`).join('');
  const actionbar=document.createElement('div');actionbar.className='booking-actionbar';
  actionbar.innerHTML=`${canManage()&&(me.role==='owner'||booking.status==='aberta')?'<button type="button" class="alt" onclick="editBookingFromToolbar()">Editar reserva</button>':''}${canAdd()?`<button type="button" class="alt" onclick="sendBookingVoucher('${id}')">Enviar voucher por e-mail</button>`:''}<button type="button" class="alt" onclick="sendBookingVoucherWhatsApp('${id}')">Enviar voucher por WhatsApp</button><button type="button" class="alt" onclick="voucher('${id}')">Voucher</button><button type="button" class="alt" onclick="voucher('${id}',true)">Voucher sem valores</button>${booking.status==='aberta'&&me.role==='owner'?`<button type="button" class="lime" onclick="setStatus('${id}','finalizada')">Finalizar</button>`:''}${canManage()&&(me.role==='owner'||booking.status==='aberta')?`<button type="button" class="bad" onclick="deleteBooking('${id}')">Excluir reserva</button>`:''}`;
  for(const button of Array.from(dlg.querySelectorAll('button'))){
    if(button.textContent.trim()==='Visualizar voucher' || button.textContent.trim()==='Finalizar reserva') button.remove();
  }
  for(const button of Array.from(dlg.querySelectorAll('button[onclick^="saveBooking"]'))){actionbar.append(button);}
  activeBookingTab='dados';
  dlg.replaceChildren(header,actionbar,nav,panels.dados,panels.financeiro,people,panels.carrinho,history,panels.alteracoes);
}

function updateGrandTotal(){
  const box=$('#booking-grand-total'); if(!box) return;
  try{
    let cents=moneyCents($('#c_tt')?.value);
    for(const row of document.querySelectorAll('.schedule-row')) cents+=moneyCents(row.querySelector('.schedule-total').value);
    box.innerHTML=`<strong>Total geral da reserva</strong>${brl(cents/100)}`;
  }catch(error){box.textContent=error.message;}
}

// Convert decimal input to integer cents before adding or comparing money.
function moneyCents(value){
  const raw=String(value ?? '').trim();
  if(raw==='') return 0;
  if(!/^\d+(?:\.\d{1,2})?$/.test(raw)) throw new Error('Use valores positivos com até duas casas decimais.');
  const [whole,fraction='']=raw.split('.');
  const cents=Number(whole)*100+Number(fraction.padEnd(2,'0'));
  if(!Number.isSafeInteger(cents) || cents>9999999999) throw new Error('Valor fora do limite permitido.');
  return cents;
}
function pendingBookingKey(){
  if(!acc?.id || !me?.user_id) throw new Error('Faça login novamente antes de salvar.');
  return `booking-pending:${acc.id}:${me.user_id}`;
}
function readPendingBookingSave(){
  const raw=sessionStorage.getItem(pendingBookingKey());
  if(!raw) return null;
  const pending=JSON.parse(raw);
  if(pending.args?.p_account_id!==acc.id || !pending.args?.p_request_id) throw new Error('Tentativa pendente inválida.');
  return pending;
}
function definitiveBookingError(result){
  const code=String(result.error?.code || '');
  return /^([0-9A-Z]{5}|PGRST\d+)$/.test(code) && code!=='PGRST000' && code!=='PGRST001' && code!=='PGRST002' && code!=='PGRST003';
}
async function submitPendingBooking(pending){
  const result=await db.rpc(pending.kind==='payment' ? 'add_payment_atomic' : 'save_booking_atomic',pending.args);
  if(result.error){
    if(definitiveBookingError(result)) sessionStorage.removeItem(pendingBookingKey());
    if(result.error.code==='40001') throw new Error('Outra pessoa ou aba alterou a reserva. Reabra a reserva antes de editar.');
    if(result.error.code==='PGRST202') throw new Error('A atualização do banco ainda não foi instalada. Use a versão anterior até concluir a preparação.');
    throw new Error(result.error.message || 'Resultado ainda não confirmado. Use Verificar salvamento antes de tentar outra operação.');
  }
  if(!result.data?.id || !Number.isInteger(Number(result.data.write_version))) throw new Error('Resposta incompleta. Verifique o salvamento pendente.');
  sessionStorage.removeItem(pendingBookingKey());
  return result.data.id;
}
async function finishBookingSave(bookingId,sendEmail,kind){
  $('#dlg').close();
  await load();
  if(kind==='payment'){await openBooking(bookingId);return;}
  if(googleAccessToken && googleTokenExpiresAt>Date.now()){
    const savedBooking=bookings.find(item=>item.id===bookingId);
    if(savedBooking){
      try{await syncGoogleBooking(savedBooking);}
      catch(error){alert('Reserva salva, mas a sincronização com o Google Agenda falhou: '+error.message);}
    }
  }else if(acc.google_calendar_client_id){
    alert('Reserva salva. Para sincronizar com o Google Agenda, abra Equipe e conecte novamente.');
  }
  if(sendEmail) await sendBookingVoucher(bookingId);
}
let bookingSaveInProgress=false;
async function saveBooking(id,sendEmail=false){
  if(bookingSaveInProgress) return;
  bookingSaveInProgress=true;
  try{
    const pending=readPendingBookingSave();
    if(pending){
      const bookingId=await submitPendingBooking(pending);
      await finishBookingSave(bookingId,pending.sendEmail,pending.kind);
      return;
    }
    return await persistBooking(id,sendEmail);
  }catch(error){
    alert('Salvamento não concluído ou ainda não confirmado: '+error.message);
  }finally{bookingSaveInProgress=false;}
}

async function persistBooking(id,sendEmail=false){

  if(id && !canManage()) return alert('Seu nível de acesso não permite editar reservas existentes.');
  if(!id && !canAdd()) return alert('Seu nível de acesso não permite criar reservas.');

  // Validate raw inputs before numeric fallbacks can hide invalid values.
  const rows = [...document.querySelectorAll('.schedule-row')];
  const moneyInputs = [$('#c_tt'), $('#c_signal'), ...rows.flatMap(row =>
    [row.querySelector('.schedule-total'), row.querySelector('.schedule-signal')])].filter(Boolean);
  if(moneyInputs.some(input => input.validity?.badInput || !Number.isFinite(Number(input.value)) || Number(input.value) < 0)){
    return alert('Informe valores e sinais válidos, iguais ou maiores que zero.');
  }
  const paxInputs = [$('#c_px'), ...rows.map(row => row.querySelector('.schedule-pax'))];
  if(paxInputs.some(input => !Number.isInteger(Number(input.value)) || Number(input.value) < 1)){
    return alert('A quantidade de pessoas deve ser um número inteiro maior que zero.');
  }
  const installmentInputs = [
    ...(!id && val('c_signal_method') === 'Cartão de crédito' && Number(val('c_signal')) > 0 ? [$('#c_signal_installments')] : []),
    ...rows.filter(row => Number(row.querySelector('.schedule-signal')?.value) > 0 && row.querySelector('.schedule-signal-method')?.value === 'Cartão de crédito')
      .map(row => row.querySelector('.schedule-signal-installments'))
  ];
  if(installmentInputs.some(input => !Number.isInteger(Number(input.value)) || Number(input.value) < 1)){
    return alert('Informe um número inteiro de parcelas maior que zero.');
  }

  const v = {
    client_name:titleCaseName(val('c_name')),
    client_phone:val('c_tel').trim(),
    client_email:val('c_email').trim(),
    client_document:val('c_doc').trim(),
    client_state:val('c_state') || null,
    client_country:val('c_country').trim() || null,
    client_birthday:val('c_birthday') || null,
    tour_date:val('c_dt'),
    tour_time:val('c_hr') || null,
    itinerary:val('c_it'),
    pickup_location:val('c_pickup').trim(),
    pax:Number(val('c_px')) || 1,
    total:Number(val('c_tt')) || 0,
    client_message:val('c_client_message').trim(),
    ticket_included:$('#c_ti').checked,
    ticket_bought:$('#c_tb').checked,
    voucher_options:{
      transport:$('#v_transport').checked,
      breakfast:$('#v_breakfast').checked,
      iphone_photos:$('#v_iphone').checked,
      camera_photos:$('#v_camera').checked
    },
    notes:val('c_nt').trim()
  };

  v.schedule_items = [{
    service_id:id && Array.isArray(bookings.find(b => b.id === id)?.schedule_items)
      ? bookings.find(b => b.id === id).schedule_items[0]?.service_id || 'principal'
      : 'principal',
    tour_date:v.tour_date,
    tour_time:v.tour_time,
    itinerary:v.itinerary,
    pax:v.pax,
    ticket_included:v.ticket_included,
    ticket_info:val('c_ticket_info').trim(),
    service_total:moneyCents(val('c_tt')) / 100
  }];

  const newSignals = [];
  for(const row of document.querySelectorAll('.schedule-row')){
    const item = {
      service_id:row.dataset.serviceId || crypto.randomUUID(),
      tour_date:row.querySelector('.schedule-date').value,
      tour_time:row.querySelector('.schedule-time').value || null,
      itinerary:row.querySelector('.schedule-itinerary').value,
      pax:Number(row.querySelector('.schedule-pax').value) || 1,
      service_total:moneyCents(row.querySelector('.schedule-total').value) / 100,
      ticket_included:row.querySelector('.schedule-ticket').checked,
      ticket_info:row.querySelector('.schedule-ticket-info').value.trim(),
      ticket_bought:row.querySelector('.schedule-ticket-bought').checked,
      pickup:row.querySelector('.schedule-pickup').value.trim(),
      options:{
        transport:row.querySelector('.schedule-transport').checked,
        breakfast:row.querySelector('.schedule-breakfast').checked,
        iphone_photos:row.querySelector('.schedule-iphone').checked,
        camera_photos:row.querySelector('.schedule-camera').checked
      }
    };
    v.schedule_items.push(item);

    const signalInput = row.querySelector('.schedule-signal');
    const amount = moneyCents(signalInput?.value) / 100;
    if(amount > 0){
      if(amount > item.service_total){
        return alert('O sinal de um dos roteiros adicionais é maior que o valor total desse roteiro.');
      }
      const method = row.querySelector('.schedule-signal-method').value;
      newSignals.push({
        amount,
        method,
        installments: method === 'Cartão de crédito'
          ? Math.max(1,Number(row.querySelector('.schedule-signal-installments').value) || 1)
          : 1,
        paid_at:row.querySelector('.schedule-signal-date').value || iso(new Date()),
        service_id:item.service_id,
        label:`${item.itinerary} · ${dBR(item.tour_date)}`
      });
    }
  }

  // o total da reserva passa a ser a soma de todos os roteiros
  v.total = v.schedule_items.reduce((sum,item) => sum + moneyCents(item.service_total),0) / 100;

  if(v.schedule_items.some(item => !item.tour_date || !item.itinerary || item.pax < 1)){
    return alert('Preencha data, roteiro e quantidade de pessoas em cada dia da reserva.');
  }

  const docKey = v.client_document.toLowerCase().replace(/[^a-z0-9]/g,'');
  const emailKey = v.client_email.toLowerCase();
  const scheduleKey = items => bookingServices(items).map(item => `${item.tour_date}|${String(item.itinerary || '').trim().toLowerCase()}`).sort().join('||');
  const duplicate = !id && bookings.find(existing => {
    if(existing.status === 'cancelada' || existing.deleted_at) return false;
    const sameClient = (docKey && String(existing.client_document || '').toLowerCase().replace(/[^a-z0-9]/g,'') === docKey)
      || (emailKey && String(existing.client_email || '').trim().toLowerCase() === emailKey);
    return sameClient
      && Number(existing.total || 0).toFixed(2) === Number(v.total || 0).toFixed(2)
      && scheduleKey(existing) === scheduleKey(v);
  });
  if(duplicate){
    return alert(`Esta reserva parece duplicada. Já existe ${duplicate.booking_code ? 'a reserva ' + duplicate.booking_code : 'uma reserva'} para este cliente com os mesmos dias, roteiros e valor.`);
  }

  if(!id && (!v.client_name || !v.client_document || !v.client_email || !v.tour_date || !v.itinerary || v.pax < 1)){
    return alert('Preencha nome completo, documento, e-mail, data, quantidade de pessoas e roteiro.');
  }

  if(sendEmail && !v.client_email){
    return alert('Informe o e-mail do cliente antes de enviar o voucher.');
  }

  if(v.client_email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.client_email)){
    return alert('Informe um e-mail válido para o cliente.');
  }

  const signal = id ? 0 : moneyCents(val('c_signal')) / 100;
  const mainServiceTotal = Number(val('c_tt')) || 0;
  const extraSignalsSum = newSignals.reduce((s,x) => s + moneyCents(x.amount),0);
  if(!id && (signal < 0 || signal > mainServiceTotal)){
    return alert('O sinal do roteiro principal precisa ser igual ou menor que o valor total desse roteiro.');
  }
  if(moneyCents(signal) + extraSignalsSum > moneyCents(v.total)){
    return alert('A soma dos sinais não pode ser maior que o total da reserva.');
  }

  const signalsToSave=newSignals.map(s=>({
    service_id:s.service_id, amount:s.amount, method:s.method,
    installments:s.installments, paid_at:s.paid_at, notes:`Sinal do roteiro: ${s.label}`
  }));
  if(!id && signal>0){
    const method=val('c_signal_method');
    signalsToSave.unshift({
      service_id:v.schedule_items[0].service_id, amount:signal, method,
      installments:method==='Cartão de crédito' ? Number(val('c_signal_installments')) : 1,
      paid_at:val('c_signal_date') || iso(new Date()), notes:'Sinal do roteiro principal'
    });
  }
  const version=id ? Number($('#dlg').dataset.writeVersion) : null;
  if(id && (!Number.isInteger(version) || version<1)) return alert('Reabra a reserva para carregar sua versão atual antes de editar.');
  const pending={sendEmail,args:{
    p_account_id:acc.id, p_request_id:crypto.randomUUID(), p_booking_id:id || null,
    p_expected_version:version, p_booking:v, p_signals:signalsToSave
  }};
  // Save retry context before sending; if the response is lost, replay the same identifier.
  sessionStorage.setItem(pendingBookingKey(),JSON.stringify(pending));
  const bookingId=await submitPendingBooking(pending);
  await finishBookingSave(bookingId,sendEmail);
}


async function deleteBooking(id){
  if(!canManage()) return alert('Seu nível de acesso não permite excluir reservas.');
  const booking = bookings.find(item => item.id === id);
  if(!booking || (me.role !== 'owner' && booking.status !== 'aberta')) return alert('Somente o responsável pode ocultar uma reserva que não está aberta.');
  if(Object.keys(booking?.google_event_ids || {}).length && (!googleAccessToken || googleTokenExpiresAt <= Date.now())) return alert('Esta reserva tem evento no Google Agenda. Abra Equipe e conecte o Google antes de excluir, para remover o evento também.');
  if(!confirm(`Excluir a reserva ${booking?.booking_code || ''}? Ela sairá da agenda e será ocultada, mas ficará preservada no banco.`)) return;
  if(googleAccessToken && googleTokenExpiresAt > Date.now()){
    try{ await removeGoogleEvents(booking); }
    catch(error){ return alert('Não consegui remover o evento do Google Agenda; a reserva continua na agenda. ' + error.message); }
  }
  const {error} = await db.from('bookings').update({deleted_at:new Date().toISOString()}).eq('id',id).eq('account_id',acc.id);
  if(error) return alert('Não foi possível excluir a reserva: ' + error.message);
  $('#dlg').close();
  await load();
}

async function addPay(bid){
  if(bookingSaveInProgress) return;
  if(!canAdd()) return alert('Seu nível de acesso não permite adicionar pagamentos.');
  bookingSaveInProgress=true;
  try{
    let pending=readPendingBookingSave();
    if(!pending){
      const cents=moneyCents(val('p_amt'));
      const installments=Number(val('p_inst'));
      const method=val('p_met');
      if(cents<=0) return alert('Informe o valor do pagamento.');
      if(!Number.isInteger(installments) || installments<1) return alert('Informe parcelas inteiras maiores que zero.');
      if(method!=='Cartão de crédito' && installments!==1) return alert('Parcelas só podem ser usadas no cartão de crédito.');
      if(!val('p_dt')) return alert('Informe a data do pagamento.');
      pending={kind:'payment',sendEmail:false,args:{
        p_account_id:acc.id,p_request_id:crypto.randomUUID(),p_booking_id:bid,
        p_payment:{amount:cents/100,method,payment_type:val('p_type'),installments,paid_at:val('p_dt'),notes:val('p_note').trim() || null}
      }};
      sessionStorage.setItem(pendingBookingKey(),JSON.stringify(pending));
    }
    const bookingId=await submitPendingBooking(pending);
    await finishBookingSave(bookingId,pending.sendEmail,pending.kind);
  }catch(error){alert('Pagamento não concluído ou ainda não confirmado: '+error.message);}
  finally{bookingSaveInProgress=false;}
}

async function voidPay(pid,bid){

  if(me.role !== 'owner') return alert('Somente o responsável pode estornar pagamentos.');

  if(
    !confirm(
      'Estornar este pagamento?'
    )
  ){
    return;
  }


  const r =
    await db
      .from('payments')
      .update({
        voided:true
      })
      .eq('id',pid);


  if(r.error){

    return alert(r.error.message);
  }


  await load();

  openBooking(bid);
}

async function setStatus(id,s){

  if(s === 'finalizada' && me.role !== 'owner') return alert('Somente o responsável pode finalizar reservas.');

  if(!canManage()) return alert('Seu nível de acesso não permite alterar o status da reserva.');

  const before=bookings.find(item => item.id === id);
  if(s === 'cancelada' && Object.keys(before?.google_event_ids || {}).length && (!googleAccessToken || googleTokenExpiresAt <= Date.now())){
    return alert('Esta reserva tem evento no Google Agenda. Conecte o Google em Equipe antes de cancelar, para remover o evento também.');
  }

  if(
    !confirm(
      'Confirmar: ' + s + '?'
    )
  ){
    return;
  }


  const r =
    await db
      .from('bookings')
      .update({
        status:s
      })
      .eq('id',id);


  if(r.error){

    return alert(r.error.message);
  }


  await load();

  const updatedBooking=bookings.find(item => item.id === id);
  if(googleAccessToken && googleTokenExpiresAt > Date.now() && updatedBooking){
    try{ await syncGoogleBooking(updatedBooking); }
    catch(error){ alert('Status atualizado no app, mas o Google Agenda não foi sincronizado: ' + error.message); }
  }

  openBooking(id);
}

    if(r.error)return alert('Não foi possível consultar o colaborador: '+r.error.message);
    record=r.data;
    if(!record||record.role!=='staff'||record.user_id===me.user_id)return alert('Esse acesso não pode ser alterado por esta tela.');
  }else if(kind==='invite'){
    const r=await db.from('invites').select('*').eq('account_id',acc.id).eq('email',key).is('accepted_at',null).maybeSingle();
    if(r.error)return alert('Não foi possível consultar o convite: '+r.error.message);
    record=r.data;
    if(!record||record.role!=='staff')return alert('Convite pendente de colaborador não encontrado. Atualize a equipe.');
  }else return alert('Seleção de colaborador inválida.');
  teamPermissionEdit={kind,key,account_id:acc.id,record:{...record}};
  $('#dlg').innerHTML=`
    <h2>Alterar permissões</h2><p><b>${esc(record.name||record.email||'Colaborador')}</b><br><span class="m">${esc(record.email||'')}</span></p>
    <label for="team_department">Função / área</label><input id="team_department" maxlength="80" value="${esc(record.department||'Equipe')}">
    <label for="team_access">Perfil de acesso</label><select id="team_access" onchange="updateTeamAccessPreview(this.value,'team_access_help')">${teamProfileOptions(record.access_level)}</select>
    <p id="team_access_help" class="team-profile-description">${esc(TEAM_ACCESS_PROFILES[record.access_level]?.description||TEAM_ACCESS_PROFILES.visualizar.description)}</p>
    ${teamPermissionsGuide()}
    <p class="m">${kind==='member'?'A mudança passa a valer no banco ao salvar. O colaborador deve recarregar o app para atualizar os botões.':'A mudança será usada quando esse convite for aceito. Nenhum e-mail será enviado ao salvar.'}</p>
    <p id="team_permission_message" role="status" aria-live="polite"></p>
    <div class="team-member-actions"><button id="team_permission_save" onclick="saveTeamPermissions()">Salvar permissões</button><button id="team_permission_cancel" class="alt" onclick="openConfig()">Voltar</button></div>
  `;
  if(!$('#dlg').open)$('#dlg').showModal();
}

async function saveTeamPermissions(){
  if(teamPermissionSaveInProgress)return;
  if(me?.role!=='owner')return alert('Somente o responsável pode alterar permissões.');
  const edit=teamPermissionEdit;
  if(!edit||edit.account_id!==acc.id||edit.record.role!=='staff')return alert('Reabra as permissões desse colaborador.');
  const access_level=val('team_access'),department=val('team_department').trim();
  const message=$('#team_permission_message');
  if(!Object.hasOwn(TEAM_ACCESS_PROFILES,access_level))return message.textContent='Selecione um perfil válido.';
  if(!department||department.length>80)return message.textContent='Informe a função / área com até 80 caracteres.';
  if(access_level===edit.record.access_level&&department===edit.record.department)return message.textContent='Nenhuma alteração para salvar.';
  const saveButton=$('#team_permission_save'),cancelButton=$('#team_permission_cancel');
  teamPermissionSaveInProgress=true;saveButton.disabled=true;cancelButton.disabled=true;message.textContent='Salvando permissões…';
  try{
    let q=db.from(edit.kind==='member'?'members':'invites').update({department,access_level})
      .eq('account_id',edit.account_id).eq(edit.kind==='member'?'user_id':'email',edit.key)
      .eq('role','staff').eq('access_level',edit.record.access_level).eq('department',edit.record.department);
    if(edit.kind==='invite')q=q.is('accepted_at',null);
    const {data,error}=await q.select('*').maybeSingle();
    if(error)throw Error(error.message);
    if(!data){message.textContent='Nada foi alterado. O acesso mudou em outra aba, o convite já foi aceito ou você perdeu a permissão. Volte e atualize a equipe.';return;}
    edit.record={...data};
    if(edit.kind==='member')team[data.user_id]=data;
    message.textContent='Permissões salvas. A alteração foi registrada no histórico.';
  }catch(error){
    message.textContent='Não foi possível confirmar a alteração. Volte e confira o perfil atual antes de tentar novamente. '+error.message;
  }finally{
    teamPermissionSaveInProgress=false;saveButton.disabled=false;cancelButton.disabled=false;
  }
}

async function removeCollaborator(encodedUserId){
  if(me.role !== 'owner') return alert('Somente o responsável pode remover colaboradores.');
  const userId = decodeURIComponent(encodedUserId);
  const member = team[userId];
  if(!member || member.role === 'owner') return alert('O responsável da conta não pode ser removido por aqui.');
  if(!confirm(`Remover o acesso de ${member.name || member.email} ao app? A conta de login da pessoa não será apagada.`)) return;
  const {error} = await db.from('members').delete().eq('user_id',userId).eq('account_id',acc.id);
  if(error) return alert('Não foi possível remover o acesso: ' + error.message);
  delete team[userId];
  openConfig();
}

async function toggleItineraryTransport(id, current){

  if(error) return alert(error.message);

}


async function invite(){

  const email =
    val('i_em')
      .trim()
      .toLowerCase();


  if(me.role !== 'owner') return alert('Somente o responsável pode convidar pessoas.');
  const department = val('i_department');
  const access_level = val('i_access');
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert('Informe um e-mail válido.');
  if(teamEmailExists(email)) return alert('Este e-mail já tem acesso ao app.');

  const pending = await db.from('invites').select('email').eq('account_id',acc.id).ilike('email',email).is('accepted_at',null).limit(1).maybeSingle();
  let saved;
  if(pending.data){
    saved = await db.from('invites').update({department,access_level}).eq('account_id',acc.id).ilike('email',email).is('accepted_at',null);
  }else{
    saved = await db.from('invites').insert({email,account_id:acc.id,role:'staff',department,access_level});
  }
  if(saved.error) return alert('Não foi possível registrar o convite: ' + saved.error.message);
  const result = await sendTeamInvitation(email,department,access_level);
  if(result.error) return alert('O convite ficou salvo, mas o e-mail não foi enviado: ' + result.error);
  alert('Convite enviado para ' + email + '. A pessoa deverá criar a conta usando esse mesmo e-mail.');
  openConfig();
}

async function sendTeamInvitation(email,department,access_level){
  const inviteUrl = new URL(location.href);
  inviteUrl.searchParams.set('convite',email);
  inviteUrl.hash = '';
  const sent = await db.functions.invoke('send-team-invitation',{
    body:{email,account_id:acc.id,department,access_level,app_url:inviteUrl.toString()}
  });
  if(sent.error){
    let detail=sent.error.message || 'Falha ao chamar a função.';
    try{
      const response=sent.error.context;
      if(response && typeof response.clone==='function'){
        const body=await response.clone().json();
        detail=body.error || body.message || detail;
      }
    }catch{}
    return {error:detail};
  }
  if(sent.data?.error) return {error:sent.data.error};
  return {error:''};
}

async function resendTeamInvitation(encodedEmail){
  const email = decodeURIComponent(encodedEmail);
  const invite = await db.from('invites').select('email,department,access_level').eq('account_id',acc.id).ilike('email',email).is('accepted_at',null).limit(1).maybeSingle();
  if(invite.error || !invite.data) return alert('Convite pendente não encontrado. Atualize a aba Equipe.');
  const result = await sendTeamInvitation(invite.data.email,invite.data.department,invite.data.access_level);
  if(result.error) return alert('Não foi possível reenviar: ' + result.error);
  alert('Convite reenviado para ' + email + '.');
}

async function deleteTeamInvitation(encodedEmail){
  if(me.role !== 'owner') return alert('Somente o responsável pode excluir convites.');
  const email=decodeURIComponent(encodedEmail);
  if(!confirm(`Excluir o convite pendente de ${email}?`)) return;
  const {error}=await db.from('invites').delete().eq('account_id',acc.id).ilike('email',email).is('accepted_at',null);
  if(error) return alert('Não foi possível excluir o convite: ' + error.message + '. Pode ser necessário atualizar a permissão de convites no Supabase.');
  alert('Convite pendente excluído.');
  openConfig();
}

function teamEmailExists(email){
  const normalized = email.trim().toLowerCase();
  return Object.values(team).some(member => String(member.email || '').trim().toLowerCase() === normalized);
}

function requestGoogleAccessToken(clientId){
  return new Promise((resolve,reject) => {
    if(!window.google?.accounts?.oauth2) return reject(new Error('O serviço de login do Google ainda está carregando. Atualize a página e tente novamente.'));
    const client = google.accounts.oauth2.initTokenClient({
      client_id:clientId,
      scope:'https://www.googleapis.com/auth/calendar.events',
      callback:response => {
        if(response.error) return reject(new Error(response.error_description || response.error));
        googleAccessToken = response.access_token;
        googleTokenExpiresAt = Date.now() + Number(response.expires_in || 3600) * 1000;
        resolve(googleAccessToken);
      },
      error_callback:error => reject(new Error(error.message || 'Não foi possível entrar no Google.'))
    });
    client.requestAccessToken({prompt:''});
  });
}

async function googleCalendarRequest(path,method='GET',body=null){
  if(!googleAccessToken || googleTokenExpiresAt <= Date.now()) throw new Error('A conexão do Google expirou. Conecte novamente em Equipe.');
  const response = await fetch(`https://www.googleapis.com/calendar/v3${path}`,{
    method,
    headers:{Authorization:`Bearer ${googleAccessToken}`,'Content-Type':'application/json'},
    ...(body ? {body:JSON.stringify(body)} : {})
  });
  const result = response.status === 204 ? {} : await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(result.error?.message || `Google Agenda retornou ${response.status}.`);
  return result;
}

function googleEventPayload(booking,item){
  const code = booking.booking_code || booking.id;
  const event = {
    summary:`${code} · ${booking.client_name} · ${item.itinerary}`,
    description:`Localizador: ${code}\nCliente: ${booking.client_name}\nRoteiro: ${item.itinerary}\nPessoas: ${item.pax}\nValor total da reserva: ${brl(booking.total)}`,
    location:item.pickup || booking.pickup_location || '',
    extendedProperties:{private:{booking_id:booking.id,service_id:item.service_id || 'principal',booking_code:code}}
  };
  if(item.tour_time){
    const start = new Date(`${item.tour_date}T${String(item.tour_time).slice(0,5)}:00-03:00`);
    const end = new Date(start.getTime()+60*60*1000);
    event.start={dateTime:start.toISOString(),timeZone:'America/Sao_Paulo'};
    event.end={dateTime:end.toISOString(),timeZone:'America/Sao_Paulo'};
  }else{
    const next = new Date(`${item.tour_date}T00:00:00Z`);
    next.setUTCDate(next.getUTCDate()+1);
    event.start={date:item.tour_date};
    event.end={date:next.toISOString().slice(0,10)};
  }
  return event;
}

async function removeGoogleEvents(booking){
  const ids = booking?.google_event_ids || {};
  for(const eventId of Object.values(ids)){
    try{ await googleCalendarRequest(`/calendars/primary/events/${encodeURIComponent(eventId)}`,'DELETE'); }
    catch(error){ if(!String(error.message).includes('404')) throw error; }
  }
}

async function syncGoogleBooking(booking){
  if(!booking || !googleAccessToken || googleTokenExpiresAt <= Date.now()) return;
  if(booking.status === 'cancelada' || booking.deleted_at){ await removeGoogleEvents(booking); return; }
  const ids={...(booking.google_event_ids || {})};
  const services=bookingServices(booking);
  const keep=new Set();
  for(const item of services){
    const key=item.service_id || 'principal';
    keep.add(key);
    const path=`/calendars/primary/events${ids[key] ? '/' + encodeURIComponent(ids[key]) : ''}`;
    let result;
    try{
      result=await googleCalendarRequest(path,ids[key] ? 'PUT' : 'POST',googleEventPayload(booking,item));
    }catch(error){
      if(ids[key] && String(error.message).includes('404')){
        result=await googleCalendarRequest('/calendars/primary/events','POST',googleEventPayload(booking,item));
      }else throw error;
    }
    if(result.id) ids[key]=result.id;
  }
  for(const [key,eventId] of Object.entries(ids)){
    if(!keep.has(key)){
      try{ await googleCalendarRequest(`/calendars/primary/events/${encodeURIComponent(eventId)}`,'DELETE'); }
      catch(error){ if(!String(error.message).includes('404')) throw error; }
      delete ids[key];
    }
  }
  const {data,error}=await db.from('bookings').update({google_event_ids:ids}).eq('id',booking.id).eq('account_id',acc.id).select('*,payments!payments_booking_account_fkey(*)').single();
  if(error) throw new Error('Evento criado, mas não foi possível salvar o vínculo no app: ' + error.message);
  booking.google_event_ids=ids;
  Object.assign(booking,data);
}

async function connectGoogleCalendar(){
  const clientId=$('#a_google_client_id')?.value.trim() || acc.google_calendar_client_id || '';
  if(!clientId) return alert('Cole primeiro o Google OAuth Client ID nas configurações.');
  try{
    await requestGoogleAccessToken(clientId);
    const {error}=await db.from('accounts').update({google_calendar_client_id:clientId}).eq('id',acc.id);
    if(error) throw new Error(error.message);
    acc.google_calendar_client_id=clientId;
    let synced=0;
    for(const booking of bookings){
      await syncGoogleBooking(booking);
      if(booking.status !== 'cancelada' && !booking.deleted_at) synced++;
    }
    alert(`${synced} reserva(s) sincronizada(s) com o Google Agenda.`);
  }catch(error){
    alert('Não foi possível conectar/sincronizar o Google Agenda: ' + error.message);
  }
}

function applyItineraryPrice(el){
  const row = el && el.closest ? el.closest('.schedule-row') : null;

  if(row){
    // roteiro adicional: recalcula só o valor deste bloco
    const option = row.querySelector('.schedule-itinerary').selectedOptions[0];
    const pax = Number(row.querySelector('.schedule-pax').value) || 1;
    if(option && option.value){
      row.querySelector('.schedule-total').value = (Number(option.dataset.price || 0) * pax).toFixed(2);
    }
  }else{
    // roteiro principal
    const option = $('#c_it').selectedOptions[0];
    const pax = Number($('#c_px').value) || 1;
    if(option && option.value){
      $('#c_tt').value = (Number(option.dataset.price || 0) * pax).toFixed(2);
    }
  }

  updateGrandTotal();
}


function applyPaxPrice(){
