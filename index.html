<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reservas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g:#0f3d2e;--l:#b6e14a;--bg:#f5f6f2;--ink:#17201b;--mut:#66726b;--line:#dde2db;--red:#a4332b;box-sizing:border-box}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:18px}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--g);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--g);border:1px solid var(--line)}
button.lime{background:var(--l);color:var(--g);font-weight:600}
button.bad{background:#fff;color:var(--red);border:1px solid var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--l);outline-offset:1px}
main{max-width:760px;margin:0 auto;padding:14px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.nav b{flex:1;text-align:center}
.day{margin:16px 0 6px;font-weight:700;color:var(--g)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.card.cancelada{opacity:.55}
.top{display:flex;justify-content:space-between;gap:8px}
.m{color:var(--mut);font-size:14px}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;background:#e8eee6}
.tag.finalizada{background:var(--l);color:var(--g)}.tag.cancelada{background:#f3dcd9;color:var(--red)}
.open{color:var(--red);font-weight:600}.ok{color:var(--g);font-weight:600}
dialog{border:0;border-radius:12px;max-width:560px;width:calc(100% - 20px);padding:16px;max-height:92vh}
dialog::backdrop{background:#0008}
h3{margin:14px 0 6px}
.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.void{text-decoration:line-through;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#login{max-width:360px;margin:12vh auto;padding:20px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
// 1) Cole aqui os dados do seu projeto Supabase (Project Settings > API)
const SUPABASE_URL = 'https://ewhfabhktkvrjddnvgkl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SPL6PHiYz1ntLqehGJkRVg_D4a_07QU';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const dBR = s => s.split('-').reverse().join('/');
const dtBR = s => new Date(s).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
const paid = b => (b.payments || []).filter(p => !p.voided).reduce((s, p) => s + Number(p.amount), 0);
const nm = id => (team[id] && team[id].name) || '—';
const val = id => $('#' + id).value;
let me, acc, team = {}, bookings = [], week = monday(new Date());

async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return loginView();
  const m = await db.from('members').select('*');
  team = Object.fromEntries((m.data || []).map(x => [x.user_id, x]));
  me = team[session.user.id];
  if (!me) { await db.auth.signOut(); return loginView('Este e-mail não tem acesso. Peça um convite ao dono.'); }
  acc = (await db.from('accounts').select('*').single()).data;
  await load();
}

function loginView(msg) {
  $('#app').innerHTML = `<div id="login"><h2>Reservas</h2>
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password">
  <p class="open" id="msg">${esc(msg || '')}</p>
  <div class="acts"><button onclick="login()">Entrar</button><button class="alt" onclick="signup()">Criar conta (com convite)</button></div></div>`;
}
async function login() {
  const r = await db.auth.signInWithPassword({ email: val('em').trim(), password: val('pw') });
  if (r.error) return $('#msg').textContent = 'E-mail ou senha incorretos.';
  start();
}
async function signup() {
  const r = await db.auth.signUp({ email: val('em').trim(), password: val('pw') });
  if (r.error) return $('#msg').textContent = r.error.message.includes('convite') ? 'Este e-mail não foi convidado.' : r.error.message;
  $('#msg').textContent = 'Conta criada. Se pedir, confirme o e-mail e entre.';
  if (r.data.session) start();
}
async function logout() { await db.auth.signOut(); loginView(); }

async function load() {
  const r = await db.from('bookings').select('*, payments(*)')
    .gte('tour_date', iso(week)).lte('tour_date', iso(addDays(week, 6)))
    .order('tour_date').order('tour_time');
  bookings = r.data || [];
  render();
}

function render() {
  const days = [0,1,2,3,4,5,6].map(i => addDays(week, i));
  const names = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  let h = `<header><b>${esc(acc.name)}</b><button class="lime" onclick="openBooking()">Nova reserva</button>
    ${me.role === 'owner' ? '<button class="alt" onclick="openConfig()">Equipe</button><button class="alt" onclick="openItineraries()">Itinerários</button>' : ''}<button class="alt" onclick="logout()">Sair</button></header>
    <main><div class="nav"><button class="alt" onclick="go(-7)">‹</button><b>${dBR(iso(week)).slice(0,5)} a ${dBR(iso(addDays(week,6))).slice(0,5)}</b>
    <button class="alt" onclick="go(7)">›</button><button class="alt" onclick="go(0)">Hoje</button></div>`;
  if (!bookings.length) h += '<div class="empty">Nenhuma reserva nesta semana. Toque em “Nova reserva”.</div>';
  for (const d of days) {
    const list = bookings.filter(b => b.tour_date === iso(d));
    if (!list.length) continue;
    h += `<div class="day">${names[d.getDay()]}, ${dBR(iso(d)).slice(0,5)}</div>`;
    for (const b of list) {
      const open = Number(b.total) - paid(b);
      h += `<div class="card ${b.status}" onclick="openBooking('${b.id}')">
  <div class="top">
    <b>${esc((b.tour_time || '').slice(0,5))} ${esc(b.client_name)}</b>
    <span class="tag ${b.status}">${b.status}</span>
  </div>
  <div class="m"><b>${esc(b.booking_code || 'Sem código')}</b></div>
  <div class="m">${esc(b.itinerary || 'Sem roteiro')} · ${b.pax} pessoa(s)</div>
  <div class="m">Total ${brl(b.total)} · Pago ${brl(paid(b))} · <span class="${open > 0 ? 'open' : 'ok'}">${open > 0 ? 'Em aberto ' + brl(open) : 'Quitado'}</span></div>
</div>`;
    }
  }
  $('#app').innerHTML = h + '</main>';
}
function go(n) { week = n ? addDays(week, n) : monday(new Date()); load(); }

async function openBooking(id) {
  const b = id ? bookings.find(x => x.id === id) : { status:'aberta', pax:1, total:0, tour_date: iso(new Date()), payments: [] };
    const ir = await db.from('itineraries')
    .select('*')
    .eq('account_id', acc.id)
    .eq('active', true)
    .order('name');

  const itineraries = ir.data || [];
  const locked = id && b.status !== 'aberta' && me.role !== 'owner';
  const dis = locked ? 'disabled' : '';
  let hist = [];
  if (id) hist = (await db.from('audit_log').select('*').eq('booking_id', id).order('at', { ascending:false })).data || [];
  const pays = b.payments || [];
  let h = `<form method="dialog" style="text-align:right"><button class="alt">Fechar</button></form>
 <h2 style="margin:0">
  ${id ? 'Reserva' : 'Nova reserva'}
  ${id ? `<span class="tag ${b.status}">${b.status}</span>` : ''}
</h2>
${id && b.booking_code ? `<div class="m" style="margin-top:6px"><b>Código:</b> ${esc(b.booking_code)}</div>` : ''}
  ${id ? `<div class="m">Criada por ${esc(nm(b.created_by))} em ${dtBR(b.created_at)}${b.finalized_by ? ` · Finalizada por ${esc(nm(b.finalized_by))} em ${dtBR(b.finalized_at)}` : ''}</div>` : ''}
  <label for="c_name">Cliente</label><input id="c_name" value="${esc(b.client_name)}" ${dis}>
  <label for="c_tel">WhatsApp</label><input id="c_tel" value="${esc(b.client_phone)}" inputmode="tel" ${dis}>
  <label for="c_email">E-mail</label>
<input id="c_email" type="email" value="${esc(b.client_email)}" ${dis}>

<label for="c_doc">Documento de identificação</label>
<input id="c_doc" value="${esc(b.client_document)}" placeholder="CPF, RG ou passaporte" ${dis}>
  <div class="row"><div><label for="c_dt">Data</label><input id="c_dt" type="date" value="${b.tour_date}" ${dis}></div>
  <input id="c_hr" type="time" value="${(b.tour_time || '').slice(0,5)}" ${dis}>
  <label for="c_it">Roteiro</label>
<label for="c_it">Roteiro</label>
<select id="c_it" ${dis} onchange="applyItineraryPrice()">
  <option value="">Selecione um itinerário</option>
  ${itineraries.map(i => `
    <option value="${esc(i.name)}" data-price="${Number(i.price || 0)}" ${b.itinerary === i.name ? 'selected' : ''}>
      ${esc(i.name)} · ${brl(i.price)}
    </option>
  `).join('')}
</select>
  <div class="row"><div><label for="c_px">Pessoas</label><input id="c_px" type="number" min="1" value="${b.pax}" ${dis} onchange="applyPaxPrice()"></div>
  <div><label for="c_tt">Valor total (R$)</label><input id="c_tt" type="number" step="0.01" min="0" value="${b.total}" ${dis}></div></div>
  <label><input type="checkbox" id="c_ti" style="width:auto" ${b.ticket_included ? 'checked' : ''} ${dis}> Ingresso incluso</label>
  <label><input type="checkbox" id="c_tb" style="width:auto" ${b.ticket_bought ? 'checked' : ''} ${dis}> Ingresso já comprado</label>
  <label for="c_nt">Observações</label><textarea id="c_nt" rows="2" ${dis}>${esc(b.notes)}</textarea>
  <div class="acts">${locked ? '' : `<button onclick="saveBooking('${id || ''}')">Salvar</button>`}
  ${id ? `<button class="alt" onclick="voucher('${id}')">Voucher</button>` : ''}</div>`;
  if (id) {
    h += `<h3>Pagamentos <span class="m">(pago ${brl(paid(b))} de ${brl(b.total)})</span></h3>`;
    h += pays.length ? pays.map(p => `<div class="line"><span class="${p.voided ? 'void' : ''}">${brl(p.amount)} · ${esc(p.method)} · ${dBR(p.paid_at)} · por ${esc(nm(p.created_by))}</span>
      ${me.role === 'owner' && !p.voided ? `<button class="bad" onclick="voidPay('${p.id}','${id}')">Estornar</button>` : (p.voided ? '<span class="m">estornado</span>' : '')}</div>`).join('') : '<div class="m">Nenhum pagamento lançado.</div>';
    if (b.status === 'aberta') h += `<div class="row" style="margin-top:8px;align-items:end">
      <div>
        <label for="p_amt">Valor</label>
        <input id="p_amt" type="number" step="0.01" min="0">
      </div>

      <div>
        <label for="p_type">Tipo</label>
        <select id="p_type">
          <option value="sinal">Sinal</option>
          <option value="parcial">Parcial</option>
          <option value="total">Total</option>
          <option value="saldo">Saldo</option>
        </select>
      </div>

      <div>
        <label for="p_met">Forma</label>
        <select id="p_met">
          <option value="Pix">Pix</option>
          <option value="Cartão de crédito">Cartão de crédito</option>
          <option value="Cartão de débito">Cartão de débito</option>
          <option value="Transferência">Transferência</option>
          <option value="Dinheiro">Dinheiro</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="p_inst">Parcelas</label>
        <input id="p_inst" type="number" min="1" value="1">
      </div>

      <div>
        <label for="p_dt">Data</label>
        <input id="p_dt" type="date" value="${iso(new Date())}">
      </div>
    </div>

    <label for="p_note">Observação</label>
    <input id="p_note" placeholder="Ex.: entrada da reserva">

    <div class="acts">
      <button class="lime" onclick="addPay('${id}')">Lançar pagamento</button>
    </div>`;
    h += '<div class="acts">';
    if (b.status === 'aberta') h += (me.role === 'owner' ? `<button onclick="setStatus('${id}','finalizada')">Finalizar reserva</button>` : '') + `<button class="bad" onclick="setStatus('${id}','cancelada')">Cancelar reserva</button>`;
    else if (me.role === 'owner') h += `<button class="alt" onclick="setStatus('${id}','aberta')">Reabrir</button>`;
    h += '</div><h3>Histórico</h3>' + (hist.map(x => `<div class="line"><span>${esc(x.action)} · ${esc(nm(x.user_id))}</span><span class="m">${dtBR(x.at)}</span></div>`).join('') || '<div class="m">Sem registros.</div>');
  }
  $('#dlg').innerHTML = h; $('#dlg').showModal();
}

async function saveBooking(id) {
  const v = {
  client_name: val('c_name').trim(),
  client_phone: val('c_tel').trim(),
  client_email: val('c_email').trim(),
  client_document: val('c_doc').trim(),
  tour_date: val('c_dt'),
  tour_time: val('c_hr') || null,
    itinerary: val('c_it'), pax: Number(val('c_px')) || 1, total: Number(val('c_tt')) || 0,
    ticket_included: $('#c_ti').checked, ticket_bought: $('#c_tb').checked, notes: val('c_nt') };
  if (!v.client_name || !v.tour_date) return alert('Informe o nome do cliente e a data.');
  const r = id ? await db.from('bookings').update(v).eq('id', id) : await db.from('bookings').insert({ ...v, account_id: acc.id });
  if (r.error) return alert(r.error.message);
  $('#dlg').close(); load();
}
async function addPay(bid) {
  const amount = Number(val('p_amt'));
  const payment_type = val('p_type');
  const method = val('p_met');
  const installments = Number(val('p_inst')) || 1;
  const paid_at = val('p_dt');
  const notes = val('p_note').trim();

  if (!(amount > 0)) {
    return alert('Informe o valor do pagamento.');
  }

  if (method !== 'Cartão de crédito' && installments !== 1) {
    return alert('Parcelas só podem ser usadas no cartão de crédito.');
  }

  const r = await db.from('payments').insert({
    booking_id: bid,
    account_id: acc.id,
    amount,
    method,
    payment_type,
    installments,
    notes: notes || null,
    paid_at
  });

  if (r.error) return alert(r.error.message);

  await load();
  openBooking(bid);
}
async function voidPay(pid, bid) {
  if (!confirm('Estornar este pagamento?')) return;
  const r = await db.from('payments').update({ voided: true }).eq('id', pid);
  if (r.error) return alert(r.error.message);
  await load(); openBooking(bid);
}
async function setStatus(id, s) {
  if (!confirm('Confirmar: ' + s + '?')) return;
  const r = await db.from('bookings').update({ status: s }).eq('id', id);
  if (r.error) return alert(r.error.message);
  await load(); openBooking(id);
}

function voucher(id) {
  const b = bookings.find(x => x.id === id), open = Number(b.total) - paid(b);
  const w = window.open('', '_blank');
  w.document.write(`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voucher</title>
  <body style="font:16px/1.5 system-ui;max-width:600px;margin:20px auto;padding:0 14px;color:#17201b">
  <h1 style="color:#0f3d2e;margin-bottom:0">${esc(acc.name)}</h1><p style="margin-top:0">Confirmação de reserva</p><hr>
  <p>
  <b>Código da reserva:</b> ${esc(b.booking_code || '—')}<br>
  <b>Cliente:</b> ${esc(b.client_name)}<br>
  <b>Data:</b> ${dBR(b.tour_date)} ${esc((b.tour_time || '').slice(0,5))}<br>
  <b>Roteiro:</b> ${esc(b.itinerary)}<br>
  <b>Pessoas:</b> ${b.pax}<br>
  <b>Ingresso:</b> ${b.ticket_included ? 'incluso' : 'não incluso'}</p>
  <p><b>Valor total:</b> ${brl(b.total)}<br><b>Pago:</b> ${brl(paid(b))}<br><b>Em aberto:</b> ${brl(open)}</p>
  <h3>Política de cancelamento</h3><p style="white-space:pre-wrap">${esc(acc.cancel_policy || 'Defina a política em Equipe.')}</p>
  ${acc.review_url ? `<p>Depois do passeio, conte como foi: <a href="${esc(acc.review_url)}">deixar avaliação</a></p>` : ''}
  <button onclick="print()">Imprimir / salvar PDF</button></body>`);
  w.document.close();
}

async function openItineraries() {
  const r = await db.from('itineraries')
    .select('*')
    .eq('account_id', acc.id)
    .order('name');

  if (r.error) return alert(r.error.message);

  const items = r.data || [];

  $('#dlg').innerHTML = `
    <form method="dialog" style="text-align:right">
      <button class="alt">Fechar</button>
    </form>

    <h2 style="margin:0">Itinerários</h2>
    <p class="m">Cadastre os roteiros que você oferece.</p>

    <h3>Novo itinerário</h3>

    <label for="it_name">Nome</label>
    <input id="it_name" placeholder="Ex.: Cristo + Pão de Açúcar">

    <label for="it_desc">Descrição</label>
    <textarea id="it_desc" rows="3" placeholder="Ex.: Cristo Redentor, Pão de Açúcar e fotos nos principais pontos."></textarea>

    <div class="row">
      <div>
        <label for="it_duration">Duração</label>
        <input id="it_duration" placeholder="Ex.: 5 horas">
      </div>

      <div>
        <label for="it_price">Preço (R$)</label>
        <input id="it_price" type="number" step="0.01" min="0" placeholder="599.90">
      </div>
    </div>

    <div class="acts">
      <button class="lime" onclick="saveItinerary()">Cadastrar itinerário</button>
    </div>

    <h3>Itinerários cadastrados</h3>

    ${
      items.length
      ? items.map(i => `
        <div class="line">
          <span>
            <b>${esc(i.name)}</b>
            <br>
            <span class="m">
              ${esc(i.duration || '')}
              ${i.price ? ' · ' + brl(i.price) : ''}
              ${i.active ? ' · ativo' : ' · inativo'}
            </span>
          </span>
        </div>
      `).join('')
      : '<div class="empty">Nenhum itinerário cadastrado.</div>'
    }
  `;

  $('#dlg').showModal();
}
async function saveItinerary() {
  const name = val('it_name').trim();
  const description = val('it_desc').trim();
  const duration = val('it_duration').trim();
  const price = Number(val('it_price')) || 0;

  if (!name) {
    return alert('Informe o nome do itinerário.');
  }

  const r = await db.from('itineraries').insert({
    account_id: acc.id,
    name,
    description: description || null,
    duration: duration || null,
    price,
    active: true
  });

  if (r.error) return alert(r.error.message);

  alert('Itinerário cadastrado com sucesso!');
  openItineraries();
}
  async function invite() {
  const email = val('i_em').trim().toLowerCase();
  if (!email) return;
  const r = await db.from('invites').insert({ email, account_id: acc.id, role: 'staff' });
  if (r.error) return alert(r.error.message);
  openConfig();
}
async function saveConfig() {
  const r = await db.from('accounts').update({ name: val('a_nm'), review_url: val('a_rv'), cancel_policy: val('a_cp') }).eq('id', acc.id);
  if (r.error) return alert(r.error.message);
  acc = (await db.from('accounts').select('*').single()).data;
  $('#dlg').close(); render();
}
start();
function applyItineraryPrice() {
  const select = $('#c_it');
  const option = select.options[select.selectedIndex];

  if (!option || !option.value) return;

  const price = Number(option.dataset.price || 0);
  const pax = Number($('#c_px').value) || 1;

  if (price > 0) {
    $('#c_tt').value = (price * pax).toFixed(2);
  }
}
function applyPaxPrice() {
  applyItineraryPrice();
}
  function applyPaxPrice() {
  applyItineraryPrice();
}
</script>
</body>
</html>
